      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --org com.knowme --project-name knowme_vpn proj
          rm -rf proj/lib proj/test
          cp -R app/lib proj/lib
          cp app/pubspec.yaml proj/pubspec.yaml
          cp -R app/packages proj/packages
          cp -R app/ios_template proj/ios_template
          cp -R app/scripts proj/scripts

      - name: Install dependencies
        working-directory: proj
        run: flutter pub get

      - name: Check WireGuardKit podspec
        continue-on-error: true
        run: |
          git clone --depth 1 --branch 1.0.15-26 https://git.zx2c4.com/wireguard-apple /tmp/wg
          ls /tmp/wg | head -30
          ls /tmp/wg/*.podspec

      - name: Add Packet Tunnel extension
        working-directory: proj
        run: |
          (gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document)
          ruby scripts/add_extension.rb

      - name: Build iOS (unsigned)
        working-directory: proj
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee build.log

      - name: Verify extension is inside app
        working-directory: proj
        run: |
          ls -la build/ios/iphoneos/Runner.app/PlugIns
          test -d build/ios/iphoneos/Runner.app/PlugIns/WGExtension.appex

      - name: Package IPA
        working-directory: proj
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          (brew install ldid && \
            ldid -Sios/Runner/Runner.entitlements Payload/Runner.app/Runner && \
            ldid -Sios/WGExtension/WGExtension.entitlements Payload/Runner.app/PlugIns/WGExtension.appex/WGExtension) || echo "ldid o'tkazib yuborildi"
          zip -qry KNOWME-VPN.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KNOWME-VPN-IPA
          path: proj/KNOWME-VPN.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: proj/build.log
          if-no-files-found: ignore
